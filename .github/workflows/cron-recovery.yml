name: Cron – Recuperação de Carrinhos

on:
  schedule:
    # Roda a cada 5 minutos (mínimo suportado pelo GitHub Actions)
    - cron: '*/5 * * * *'
  # Permite disparar manualmente pelo painel do GitHub Actions
  workflow_dispatch:

jobs:
  recover-carts:
    name: Processar carrinhos abandonados
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Chamar endpoint de recuperação
        run: |
          HTTP_STATUS=$(curl --silent --output /tmp/response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            "${{ vars.APP_URL }}/api/cron/recovery")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json

          # Falha o job se status HTTP não for 2xx
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Endpoint retornou erro HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Cron concluído com sucesso"
